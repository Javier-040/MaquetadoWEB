<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario - Examen Parcial</title>
  
  <script src="https://cdn.tailwindcss.com"></script>

  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script type="text/javascript">
    (function () {
      emailjs.init("god4PXV13bYmBUWeS");
    })();
  </script>
</head>

<body class="bg-slate-100 font-sans min-h-screen flex flex-col justify-between">

  <nav class="bg-[#002B66] text-white border-b-4 border-[#FFB800] shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        
        <div class="flex items-center space-x-3">
          <span class="bg-[#FFB800] text-[#002B66] font-black text-xs px-2.5 py-1 rounded uppercase tracking-wider">
            UNDC
          </span>
          <a href="../index.html" class="font-bold text-sm sm:text-base hover:text-[#FFB800] transition">
            Desarrollo Web
          </a>
        </div>

        <div class="hidden md:flex items-center space-x-1 text-xs font-semibold uppercase">
          <a href="folio.html" class="px-3 py-2 rounded-md hover:bg-blue-900 hover:text-[#FFB800] transition">
            Inicio
          </a>
          <a href="../PARCIAL/formulario.html" class="px-3 py-2 bg-[#FFB800] text-[#002B66] rounded-md font-bold hover:bg-yellow-400 transition shadow">
            PARCIAL
          </a>

          <div class="relative group">
            <button class="px-3 py-2 rounded-md hover:bg-blue-900 transition flex items-center gap-1 focus:outline-none">
              <span>Semanas</span>
              <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20">
                <path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/>
              </svg>
            </button>

            <div class="absolute right-0 mt-0 w-56 bg-white text-gray-800 rounded-lg shadow-xl py-2 hidden group-hover:block border border-gray-100 border-t-2 border-t-[#FFB800]">
              <a href="../SEM07/React/proyecto-react/index.html" class="block px-4 py-2 hover:bg-blue-50 hover:text-[#002B66] transition">
                SEM07 React
              </a>
              <a href="../SEM06/TAILWIND/index.html" class="block px-4 py-2 hover:bg-blue-50 hover:text-[#002B66] transition">
                SEM06 Tailwind
              </a>
              <a href="../SEM05/Bootstrap/index.html" class="block px-4 py-2 hover:bg-blue-50 hover:text-[#002B66] transition">
                SEM05 Bootstrap
              </a>
              <a href="../SEM04/teclado.html" class="block px-4 py-2 hover:bg-blue-50 hover:text-[#002B66] transition">
                SEM04 JS
              </a>
              <a href="folio.html" class="block px-4 py-2 hover:bg-blue-50 hover:text-[#002B66] transition">
                SEM03 Folio IA
              </a>
              <a href="portafolio.html" class="block px-4 py-2 hover:bg-blue-50 hover:text-[#002B66] transition">
                SEM03 Folio
              </a>
              <a href="../SEM02/HTML5.html" class="block px-4 py-2 hover:bg-blue-50 hover:text-[#002B66] transition">
                SEM02 HTML5
              </a>
              <div class="border-t border-gray-100 my-1"></div>
              <a href="../index.html" class="block px-4 py-2 hover:bg-blue-50 hover:text-[#002B66] transition font-bold">
                SEM01
              </a>
            </div>
          </div>
        </div>

      </div>
    </div>
  </nav>

  <main class="flex-grow flex items-center justify-center p-4 py-8">
    <div class="bg-white rounded-2xl shadow-xl border border-gray-200 w-full max-w-md overflow-hidden">
      
      <div class="bg-[#002B66] p-6 text-white text-center relative border-b-4 border-[#FFB800]">
        <span class="inline-block bg-[#FFB800] text-[#002B66] text-[10px] font-extrabold px-3 py-0.5 rounded-full uppercase tracking-wider mb-2">
          Portal Institucional
        </span>
        <h1 class="text-2xl font-bold">Formulario de Contacto</h1>
        <p class="text-xs text-blue-100 mt-1">Universidad Nacional de Cañete</p>
      </div>

      <div class="p-6 space-y-4">
        <div id="estado-mensaje" class="hidden p-3 text-xs font-bold rounded-lg transition-all"></div>

        <form id="contact-form" class="space-y-4">

          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Nombre Completo</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-[#002B66]">
                👤
              </span>
              <input type="text" id="name" name="name" required
                class="w-full pl-9 pr-3 py-2.5 bg-slate-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#002B66] text-gray-800"
                placeholder="Ej. Javier Paucar">
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Correo Electrónico</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-[#002B66]">
                ✉️
              </span>
              <input type="email" id="email" name="email" required
                class="w-full pl-9 pr-3 py-2.5 bg-slate-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#002B66] text-gray-800"
                placeholder="2511130240@undc.edu.pe">
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Mensaje / Consulta</label>
            <div class="relative">
              <span class="absolute top-3 left-0 flex items-center pl-3 text-[#002B66]">
                💬
              </span>
              <textarea id="message" name="message" rows="3" required
                class="w-full pl-9 pr-3 py-2.5 bg-slate-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#002B66] text-gray-800 resize-none"
                placeholder="Desarrollo Web Full Stack - Examen Parcial"></textarea>
            </div>
          </div>

          <button type="submit" id="btn-send"
            class="w-full bg-[#002B66] hover:bg-blue-900 text-white font-bold py-3 px-4 rounded-lg text-sm transition duration-200 shadow-md flex items-center justify-center gap-2 uppercase tracking-wider">
            <span>📩 Enviar Mensaje</span>
          </button>

        </form>
      </div>

      <div class="bg-gray-50 py-3 text-center text-[11px] text-gray-500 border-t border-gray-100">
        © 2026 UNDC • Todos los derechos reservados
      </div>
    </div>
  </main>

  <footer class="bg-[#002B66] text-white py-3 text-center text-xs border-t-2 border-[#FFB800]">
    Desarrollo Web Full Stack — UNDC
  </footer>

  <script>
    const form = document.getElementById('contact-form');
    const btnSend = document.getElementById('btn-send');
    const estadoMensaje = document.getElementById('estado-mensaje');

    form.addEventListener('submit', function (event) {
      event.preventDefault();

      btnSend.innerText = 'ENVIANDO...';
      btnSend.disabled = true;

      const serviceID = 'service_j5mrfxc';
      const templateID = 'template_heyyt7i';

      emailjs.sendForm(serviceID, templateID, this)
        .then(() => {
          btnSend.innerText = '📩 ENVIAR MENSAJE';
          btnSend.disabled = false;

          estadoMensaje.className = "p-3 text-xs font-bold rounded-lg bg-green-100 text-green-800 border border-green-300 block";
          estadoMensaje.innerText = "¡Notificación enviada con éxito al correo!";

          form.reset();
        }, (err) => {
          console.error(err);
          btnSend.innerText = '📩 ENVIAR MENSAJE';
          btnSend.disabled = false;

          estadoMensaje.className = "p-3 text-xs font-bold rounded-lg bg-red-100 text-red-800 border border-red-300 block";
          estadoMensaje.innerText = "Error al enviar el mensaje. Intente de nuevo.";
        });
    });
  </script>
</body>

</html>
